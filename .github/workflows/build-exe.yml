name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [claude/teacher-file-manager-app-wiohl6]
    paths: [main.py, requirements.txt, template.docx, .github/workflows/build-exe.yml]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name TeacherFileManager --hidden-import pythoncom --hidden-import win32com.client --add-data "template.docx;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: TeacherFileManager-exe
          path: dist/TeacherFileManager.exe
