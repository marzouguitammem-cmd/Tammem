name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/teacher-file-manager-app-wiohl6]
    paths: [android/**, teacher_core.py, template.docx, .github/workflows/build-apk.yml, .github/scripts/android_smoke.sh]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy shared code into the app
        run: cp teacher_core.py template.docx android/src/
      - run: pip install "flet[all]==1.0.3"
      - name: Build APK
        working-directory: android
        env:
          PYTHONIOENCODING: utf-8
        run: flet build apk --split-per-abi --yes --no-rich-output -v
      - uses: actions/upload-artifact@v4
        with:
          name: TeacherFileManager-apk
          path: android/build/apk/*.apk

  # تجربة آلية: تثبيت الـ APK على محاكي أندرويد، تشغيلو، وطباعة النصوص الظاهرة على الشاشة
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TeacherFileManager-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: screen.png
          if-no-files-found: ignore
