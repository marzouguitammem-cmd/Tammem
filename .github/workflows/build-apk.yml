name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/teacher-file-manager-app-wiohl6]
    paths: [android/**, teacher_core.py, template.docx, .github/workflows/build-apk.yml, .github/scripts/android_smoke.sh, tests/fixtures/android/**]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy shared code into the app
        run: cp teacher_core.py template.docx android/src/
      - run: pip install "flet[all]==1.0.3"
      # مفتاح توقيع ثابت: بلاش بيه كل بناء يتوقّع بمفتاح جديد والأندرويد يرفض التحديث فوق النسخة القديمة.
      # الأولوية للسر ANDROID_KEYSTORE_B64 (ثابت للأبد)، وإلا مفتاح يتكوّن مرة وحدة ويتخبّى في الـ cache.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.tfm-signing
          key: tfm-android-signing-v1
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.tfm-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            if [ ! -f ~/.tfm-signing/release.jks ]; then
              keytool -genkeypair -v -keystore ~/.tfm-signing/release.jks -storepass tfm-signing -keypass tfm-signing \
                -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Teacher File Manager, O=Tammem, C=TN"
              echo "Generated a new keystore (cached for next builds)"
            else
              echo "Using cached keystore"
            fi
            echo "KS_FILE=$HOME/.tfm-signing/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=tfm-signing" >> "$GITHUB_ENV"
          fi
          keytool -list -keystore "$(grep KS_FILE "$GITHUB_ENV" | tail -1 | cut -d= -f2)" -storepass "$(grep KS_PASS "$GITHUB_ENV" | tail -1 | cut -d= -f2)" | grep -i "fingerprint" || true
      - name: Build APK
        working-directory: android
        env:
          PYTHONIOENCODING: utf-8
        # رقم البناء = رقم النسخة (versionCode): يكبر مع كل بناء باش الأندرويد يقبل التحديث
        run: >
          flet build apk --split-per-abi --yes --no-rich-output -v
          --build-number ${{ github.run_number }} --build-version 1.0.${{ github.run_number }}
          --android-signing-key-store "$KS_FILE" --android-signing-key-alias upload
          --android-signing-key-store-password "$KS_PASS" --android-signing-key-password "$KS_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: TeacherFileManager-apk
          path: android/build/apk/*.apk

  # تجربة آلية: تثبيت الـ APK على محاكي أندرويد، تشغيلو، وطباعة النصوص الظاهرة على الشاشة
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TeacherFileManager-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot
          path: screen*.png
          if-no-files-found: ignore
